<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{SUBJECT}}</title>
  <style>
    body { margin: 0; padding: 24px; background: #f4f6f8; color: #1f2933; font-family: Arial, sans-serif; }
    .container { max-width: 820px; margin: 0 auto; background: #ffffff; padding: 28px; }
    h1 { margin: 0 0 8px; color: #17324d; font-size: 24px; }
    h2 { margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 2px solid #d9e2ec; color: #17324d; font-size: 18px; }
    .intro { color: #52606d; }
    .job { margin: 12px 0; padding: 14px 16px; border-left: 4px solid #3e7cb1; background: #f8fafc; }
    .job-title { font-size: 16px; font-weight: bold; }
    .job-meta { margin-top: 5px; color: #52606d; font-size: 14px; }
    .job a { color: #1261a0; text-decoration: none; }
    .score { color: #167447; font-weight: bold; }
    .label { font-weight: bold; }
    .empty { color: #7b8794; font-style: italic; }
    .footer { margin-top: 30px; color: #7b8794; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Swiss Job AI Agent</h1>
    <p class="intro">{{SUMMARY}}</p>
    {{JOB_SECTIONS}}
    <p class="footer">Generated from configured job alerts. Verify the original posting before applying.</p>
  </div>
</body>
</html>
