name: Daily Swiss Job Agent

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: daily-swiss-job-agent
  cancel-in-progress: false

permissions:
  contents: read

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
  LINKEDIN_ALERT_EMAIL: ${{ secrets.LINKEDIN_ALERT_EMAIL }}
  LINKEDIN_ALERT_PASSWORD: ${{ secrets.LINKEDIN_ALERT_PASSWORD }}
  LINKEDIN_PROCESSED_FOLDER: ${{ vars.LINKEDIN_PROCESSED_FOLDER || 'LinkedIn/Processed' }}
  SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
  SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
  RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: jobs.sqlite3
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Run job agent
        run: python -u main.py

      - name: Save job database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: jobs.sqlite3
          key: jobs-db-${{ github.run_id }}
